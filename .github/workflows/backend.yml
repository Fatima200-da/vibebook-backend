name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibebook_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibebook_db

      JWT_SECRET: github-actions-secret

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version-file: ".nvmrc"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Migrations
        run: npx prisma migrate deploy

      - name: Schema Drift Check
        # Confirms prisma/migrations/* and schema.prisma agree, same
        # read-only technique established in Phase 21. --exit-code makes
        # this machine-checkable (0 = no diff, 2 = diff found) - the
        # command's own stdout is a "-- This is an empty migration."
        # placeholder even when there's nothing to report, so a plain
        # output-emptiness check would never fail here.
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script --exit-code

      - name: Seed Database
        run: npm run seed

      - name: Run Tests
        run: npm test